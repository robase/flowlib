services:
  flowlib:
    build: .
    ports:
      - '3000:3000'
    volumes:
      - flowlib-data:/app/data
    environment:
      # --- Server ---
      PORT: 3000

      # --- Database ---
      # SQLite (default): file path inside the container
      DATABASE_URL: 'file:/app/data/flowlib.db'
      FLOWLIB_DB_TYPE: sqlite
      # PostgreSQL: uncomment and set
      # DATABASE_URL: "postgresql://user:pass@host:5432/flowlib"
      # FLOWLIB_DB_TYPE: postgres

      # --- Admin user (created on first boot) ---
      FLOWLIB_ADMIN_EMAIL: admin@flowlib.local
      FLOWLIB_ADMIN_PASSWORD: changeme

      # --- Security (required) ---
      # Generate with: npx flowlib-cli secret
      FLOWLIB_ENCRYPTION_KEY: '' # REQUIRED — used for credential encryption + auth sessions

      # --- Webhooks ---
      # FLOWLIB_WEBHOOK_BASE_URL: "https://your-domain.com/flowlib"

      # --- Trusted origins (comma-separated, for CORS + auth) ---
      # FLOWLIB_TRUSTED_ORIGINS: "https://your-domain.com"

      # --- Logging ---
      FLOWLIB_LOG_LEVEL: info

volumes:
  flowlib-data:
