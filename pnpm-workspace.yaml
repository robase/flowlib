packages:
  - pkg/*
  - pkg/plugins/*
  - examples/*
  - experiments/*

overrides:
  '@types/react': 18.3.7
  '@types/react-dom': 18.3.7
  picomatch: '>=4.0.4'
  defu: '>=6.1.5'
  tar: '>=7.5.11'
  handlebars: '>=4.7.9'
  flatted: '>=3.4.2'
  esbuild: '>=0.25.0'
  vite: '>=8.0.5'
  lodash: '>=4.17.24'
  lodash-es: '>=4.17.24'
  brace-expansion: '>=5.0.6'
  effect: '>=3.20.0'
  path-to-regexp: '>=8.4.0'
  hono: '>=4.12.18'
  next: '>=16.2.6'
  kysely: '>=0.28.17'
  serialize-javascript: '>=7.0.5'
  undici: '>=7.24.0'
  '@hono/node-server': '>=1.19.13'
  dompurify: '>=3.4.0'
  postcss: '>=8.5.10'
  uuid: '>=14.0.0'
  '@tootallnate/once': '>=3.0.1'
  yauzl: '>=3.2.1'
  file-type: '>=21.3.2'
  ajv: '>=8.18.0'
  devalue: '>=5.6.4'
  fast-xml-parser: '>=5.7.0'
  ws: '>=8.20.1'
  qs: '>=6.15.2'
  fast-uri: '>=3.1.2'
  ip-address: '>=10.1.1'
  better-auth: '>=1.6.2'
  tmp: '>=0.2.6'
  mermaid: '>=11.14.1'

allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': true
  '@vscode/vsce-sign': true
  better-sqlite3: true
  cbor-extract: false
  core-js-pure: false
  esbuild: true
  isolated-vm: true
  keytar: false
  msw: true
  prisma: true
  sharp: false
  sqlite3: true
  unrs-resolver: false
  workerd: false

onlyBuiltDependencies:
  - '@nestjs/core'
  - '@prisma/client'
  - '@prisma/engines'
  - '@swc/core'
  - '@tailwindcss/oxide'
  - esbuild
  - msw
  - prisma
  - sharp
  - sqlite3
  - unrs-resolver
