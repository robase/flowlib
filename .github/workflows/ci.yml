name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Commit-message linting lives in pr-title.yml and applies to the PR title
  # only (the squash-merge subject), not to individual branch commits.
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: '@flowlib/db bundle-size guard'
        # Catches regressions where a heavy import sneaks into the dialect
        run: node scripts/check-db-bundle-sizes.mjs

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint:check

      - name: Typecheck
        run: pnpm typecheck

      # Covers @flowlib/core unit, @flowlib/cli, @flowlib/user-auth,
      # @flowlib/version-control, @flowlib/agents (workerd + node + frontend
      # projects), and the @flowlib/agents eval-harness self-tests. The eval
      # self-tests drive a scripted provider — deterministic, no API key.
      # Live evals (`pnpm eval:agents`) hit real models and stay out of CI.
      - name: Test
        run: pnpm test
